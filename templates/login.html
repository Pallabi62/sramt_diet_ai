{% extends 'base.html' %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-container glass-morphism" data-aos="fade-up">
        <div class="auth-header">
            <div class="auth-icon">
                <i class="fas fa-utensils"></i>
            </div>
            <h2>Welcome Back!</h2>
            <p>Sign in to continue your health journey</p>
        </div>
        
        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i>
                    <span>Username</span>
                </label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i>
                    <span>Password</span>
                </label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <div class="form-options">
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <span>Sign In</span>
                <i class="fas fa-arrow-right"></i>
            </button>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="{{ url_for('register') }}">Sign Up</a></p>
            </div>
        </form>
        
        <div class="auth-divider">
            <span>Or continue with</span>
        </div>
        
        <div class="social-auth">
            <a href="#" class="social-btn google">
                <i class="fab fa-google"></i>
                <span>Google</span>
            </a>
            <a href="#" class="social-btn facebook">
                <i class="fab fa-facebook-f"></i>
                <span>Facebook</span>
            </a>
        </div>
    </div>
</div>

<style>
/* Auth Wrapper - Full page centering */
.auth-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 100px 20px 40px;
    background: radial-gradient(circle at 20% 30%, rgba(108, 92, 231, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 206, 201, 0.15) 0%, transparent 40%);
    position: relative;
    overflow: hidden;
}

/* Auth Container */
.auth-container {
    max-width: 420px;
    width: 100%;
    padding: 40px 35px;
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    animation: slideUpFade 0.6s ease-out;
    position: relative;
    z-index: 10;
}

/* Auth Header */
.auth-header {
    text-align: center;
    margin-bottom: 35px;
}

.auth-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), rgba(0, 206, 201, 0.2));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    color: white;
    border: 2px solid rgba(255, 255, 255, 0.1);
    animation: pulseGlow 2s infinite;
}

.auth-header h2 {
    font-size: 2.2rem;
    font-weight: 700;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #fff, #a8e6cf);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
}

.auth-header p {
    color: rgba(255, 255, 255, 0.7);
    font-size: 1rem;
    font-weight: 400;
}

/* Form Styles */
.auth-form {
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 500;
    font-size: 0.95rem;
}

.form-group label i {
    color: #6c5ce7;
    font-size: 0.9rem;
    width: 16px;
}

.form-group input {
    width: 100%;
    padding: 14px 18px;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    color: white;
    font-size: 0.95rem;
    transition: all 0.3s ease;
    font-family: 'Space Grotesk', sans-serif;
}

.form-group input:focus {
    outline: none;
    border-color: #6c5ce7;
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.15);
}

.form-group input::placeholder {
    color: rgba(255, 255, 255, 0.3);
    font-weight: 300;
}

/* Form Options - Remember me and Forgot password */
.form-options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 15px 0 25px;
    padding: 0 5px;
}

.remember-me {
    display: flex;
    align-items: center;
    gap: 8px;
}

.remember-me input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #6c5ce7;
    margin: 0;
}

.remember-me label {
    color: rgba(255, 255, 255, 0.8);
    font-size: 0.9rem;
    cursor: pointer;
    margin: 0;
}

.forgot-link {
    color: rgba(255, 255, 255, 0.7);
    font-size: 0.9rem;
    text-decoration: none;
    transition: all 0.3s ease;
    padding: 5px 0;
    border-bottom: 1px solid transparent;
}

.forgot-link:hover {
    color: #00cec9;
    border-bottom-color: #00cec9;
}

/* Button */
.btn-block {
    width: 100%;
    padding: 14px 20px;
    font-size: 1.1rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(135deg, #6c5ce7, #00cec9);
    border: none;
    border-radius: 12px;
    color: white;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    letter-spacing: 0.5px;
}

.btn-block::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s ease;
}

.btn-block:hover {
    transform: translateY(-2px);
    box-shadow: 0 20px 30px -10px rgba(108, 92, 231, 0.4);
}

.btn-block:hover::before {
    left: 100%;
}

.btn-block i {
    transition: transform 0.3s ease;
    font-size: 1rem;
}

.btn-block:hover i {
    transform: translateX(5px);
}

/* Auth Footer */
.auth-footer {
    text-align: center;
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.auth-footer p {
    color: rgba(255, 255, 255, 0.7);
    font-size: 0.95rem;
}

.auth-footer a {
    color: #00cec9;
    text-decoration: none;
    font-weight: 600;
    margin-left: 5px;
    transition: all 0.3s ease;
    position: relative;
}

.auth-footer a::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 1px;
    background: #00cec9;
    transition: width 0.3s ease;
}

.auth-footer a:hover::after {
    width: 100%;
}

/* Divider */
.auth-divider {
    text-align: center;
    margin: 25px 0 20px;
    position: relative;
}

.auth-divider::before,
.auth-divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: calc(50% - 80px);
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
}

.auth-divider::before {
    left: 0;
}

.auth-divider::after {
    right: 0;
}

.auth-divider span {
    background: rgba(255, 255, 255, 0.03);
    padding: 0 15px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Social Auth */
.social-auth {
    display: flex;
    gap: 12px;
    margin-top: 10px;
}

.social-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    border-radius: 12px;
    text-decoration: none;
    color: white;
    font-weight: 500;
    font-size: 0.9rem;
    transition: all 0.3s ease;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.03);
}

.social-btn i {
    font-size: 1.1rem;
}

.social-btn.google:hover {
    background: rgba(219, 68, 55, 0.2);
    border-color: rgba(219, 68, 55, 0.3);
    transform: translateY(-2px);
}

.social-btn.facebook:hover {
    background: rgba(66, 103, 178, 0.2);
    border-color: rgba(66, 103, 178, 0.3);
    transform: translateY(-2px);
}

/* Animations */
@keyframes slideUpFade {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes pulseGlow {
    0%, 100% {
        box-shadow: 0 0 20px rgba(108, 92, 231, 0.3);
    }
    50% {
        box-shadow: 0 0 40px rgba(0, 206, 201, 0.3);
    }
}

/* Responsive Design */
@media (max-width: 480px) {
    .auth-container {
        padding: 30px 20px;
    }
    
    .auth-header h2 {
        font-size: 1.8rem;
    }
    
    .auth-icon {
        width: 60px;
        height: 60px;
        font-size: 2rem;
    }
    
    .form-options {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
    }
    
    .social-auth {
        flex-direction: column;
    }
    
    .social-btn {
        padding: 14px;
    }
}

/* Floating decoration elements */
.auth-wrapper::before {
    content: '🥗';
    position: absolute;
    top: 15%;
    left: 10%;
    font-size: 3rem;
    opacity: 0.1;
    animation: float 6s ease-in-out infinite;
}

.auth-wrapper::after {
    content: '🍎';
    position: absolute;
    bottom: 15%;
    right: 10%;
    font-size: 3rem;
    opacity: 0.1;
    animation: float 6s ease-in-out infinite reverse;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }
    50% {
        transform: translateY(-20px) rotate(10deg);
    }
}
</style>

<script>
// Add floating animation on input focus
document.querySelectorAll('.form-group input').forEach(input => {
    input.addEventListener('focus', () => {
        input.closest('.form-group').style.transform = 'scale(1.02)';
    });
    
    input.addEventListener('blur', () => {
        input.closest('.form-group').style.transform = 'scale(1)';
    });
});

// Smooth transition for form submission
document.querySelector('form').addEventListener('submit', (e) => {
    const btn = e.target.querySelector('button[type="submit"]');
    btn.innerHTML = '<span>Signing in...</span> <i class="fas fa-spinner fa-spin"></i>';
});
</script>
{% endblock %}
