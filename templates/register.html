{% extends 'base.html' %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-container glass-morphism" data-aos="fade-up">
        <div class="auth-header">
            <div class="auth-icon">📝</div>
            <h2>Create Account</h2>
            <p>Join SmartDiet and start your health journey</p>
        </div>
        
        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i>
                    Username
                </label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i>
                    Email
                </label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i>
                    Password
                </label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
                <div class="password-strength">
                    <div class="strength-bar"></div>
                </div>
                <small class="password-hint">Use at least 8 characters</small>
            </div>
            
            <div class="form-group">
                <label for="confirm-password">
                    <i class="fas fa-lock"></i>
                    Confirm Password
                </label>
                <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm your password" required>
            </div>
            
            <div class="form-check">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">
                    I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <span>Create Account</span>
                <i class="fas fa-arrow-right"></i>
            </button>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="{{ url_for('login') }}">Sign In</a></p>
            </div>
        </form>
        
        <div class="auth-divider">
            <span>or sign up with</span>
        </div>
        
        <div class="social-auth">
            <a href="#" class="social-btn google">
                <i class="fab fa-google"></i>
                <span>Google</span>
            </a>
            <a href="#" class="social-btn facebook">
                <i class="fab fa-facebook-f"></i>
                <span>Facebook</span>
            </a>
        </div>
    </div>
</div>

<style>
/* Auth Page Styles */
.auth-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 100px 20px 40px;
    background: radial-gradient(circle at 10% 20%, rgba(108, 92, 231, 0.1) 0%, transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(0, 206, 201, 0.1) 0%, transparent 30%);
}

.auth-container {
    max-width: 450px;
    width: 100%;
    padding: 40px;
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
    animation: slideUp 0.6s ease-out;
}

.auth-header {
    text-align: center;
    margin-bottom: 30px;
}

.auth-icon {
    font-size: 4rem;
    margin-bottom: 15px;
    animation: bounce 2s infinite;
}

.auth-header h2 {
    font-size: 2.2rem;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #6c5ce7, #00cec9);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.auth-header p {
    color: rgba(255, 255, 255, 0.7);
    font-size: 1rem;
}

/* Form Styles */
.auth-form {
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 500;
    font-size: 0.95rem;
}

.form-group label i {
    color: #6c5ce7;
    font-size: 0.9rem;
}

.form-group input {
    width: 100%;
    padding: 15px 20px;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    color: white;
    font-size: 1rem;
    transition: all 0.3s ease;
}

.form-group input:focus {
    outline: none;
    border-color: #6c5ce7;
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 20px rgba(108, 92, 231, 0.3);
}

.form-group input::placeholder {
    color: rgba(255, 255, 255, 0.3);
}

/* Password Strength Indicator */
.password-strength {
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
}

.strength-bar {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb);
    transition: width 0.3s ease;
}

.password-hint {
    display: block;
    font-size: 0.8rem;
    color: rgba(255, 255, 255, 0.5);
    margin-top: 5px;
}

/* Checkbox */
.form-check {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

.form-check input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #6c5ce7;
}

.form-check label {
    color: rgba(255, 255, 255, 0.8);
    font-size: 0.9rem;
}

.form-check label a {
    color: #00cec9;
    text-decoration: none;
}

.form-check label a:hover {
    text-decoration: underline;
}

/* Button */
.btn-block {
    width: 100%;
    padding: 15px;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(135deg, #6c5ce7, #00cec9);
    border: none;
    border-radius: 15px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.btn-block::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s ease;
}

.btn-block:hover {
    transform: translateY(-3px);
    box-shadow: 0 20px 40px rgba(108, 92, 231, 0.4);
}

.btn-block:hover::before {
    left: 100%;
}

.btn-block i {
    transition: transform 0.3s ease;
}

.btn-block:hover i {
    transform: translateX(5px);
}

/* Auth Footer */
.auth-footer {
    text-align: center;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.auth-footer p {
    color: rgba(255, 255, 255, 0.7);
}

.auth-footer a {
    color: #00cec9;
    text-decoration: none;
    font-weight: 600;
    margin-left: 5px;
}

.auth-footer a:hover {
    text-decoration: underline;
}

/* Divider */
.auth-divider {
    text-align: center;
    margin: 20px 0;
    position: relative;
}

.auth-divider::before,
.auth-divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: calc(50% - 70px);
    height: 1px;
    background: rgba(255, 255, 255, 0.1);
}

.auth-divider::before {
    left: 0;
}

.auth-divider::after {
    right: 0;
}

.auth-divider span {
    background: rgba(255, 255, 255, 0.05);
    padding: 0 15px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.9rem;
}

/* Social Auth */
.social-auth {
    display: flex;
    gap: 15px;
}

.social-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    border-radius: 12px;
    text-decoration: none;
    color: white;
    font-weight: 500;
    transition: all 0.3s ease;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.social-btn.google {
    background: rgba(219, 68, 55, 0.2);
}

.social-btn.facebook {
    background: rgba(66, 103, 178, 0.2);
}

.social-btn:hover {
    transform: translateY(-3px);
    border-color: rgba(255, 255, 255, 0.3);
}

.social-btn.google:hover {
    background: rgba(219, 68, 55, 0.3);
}

.social-btn.facebook:hover {
    background: rgba(66, 103, 178, 0.3);
}

/* Animations */
@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes bounce {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-10px);
    }
}

/* Responsive */
@media (max-width: 480px) {
    .auth-container {
        padding: 30px 20px;
    }
    
    .auth-header h2 {
        font-size: 1.8rem;
    }
    
    .social-auth {
        flex-direction: column;
    }
}
</style>

<script>
// Password strength indicator
document.getElementById('password').addEventListener('input', function(e) {
    const password = e.target.value;
    const strengthBar = document.querySelector('.strength-bar');
    let strength = 0;
    
    if (password.length >= 8) strength += 25;
    if (password.match(/[a-z]+/)) strength += 25;
    if (password.match(/[A-Z]+/)) strength += 25;
    if (password.match(/[0-9]+/) || password.match(/[$@#&!]+/)) strength += 25;
    
    strengthBar.style.width = strength + '%';
    
    if (strength <= 25) {
        strengthBar.style.background = '#ff6b6b';
    } else if (strength <= 50) {
        strengthBar.style.background = '#feca57';
    } else if (strength <= 75) {
        strengthBar.style.background = '#48dbfb';
    } else {
        strengthBar.style.background = '#1dd1a1';
    }
});

// Password confirmation
document.querySelector('form').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm-password').value;
    
    if (password !== confirm) {
        e.preventDefault();
        alert('Passwords do not match!');
    }
});
</script>
{% endblock %}
